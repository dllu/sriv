[package]
name = "sriv"
version = "0.1.0"
edition = "2021"

[features]
default = []
cuda = [
    "candle/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
jxl-oxide = { version = "0.12.6", default-features = false, features = ["moxcms", "rayon"] }
moxcms = { version = "0.8.1", features = ["in_place"] }
anyhow = "1.0.71"
rayon = "1.7.0"
toml = "0.5"
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
glam = "0.32"
glyphon = "0.12"
pollster = "0.4"
wgpu = "30"
winit = "0.30.13"
sha1 = "0.6"
crossbeam-channel = "0.5"
rexif = "0.7.5"
candle = { package = "candle-core", version = "0.9.2-alpha.2" }
candle-nn = "0.9.2-alpha.2"
candle-transformers = "0.9.2-alpha.2"
hf-hub = "0.4.1"
tokenizers = { version = "0.21.0", default-features = false, features = ["fancy-regex"] }
num_cpus = "1.17"
portable-pty = "0.9.0"
vt100 = "0.16.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
libheif-rs = { version = "2.7.0", default-features = false, features = ["v1_17"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "bitflags", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "objc2-core-graphics"] }

[dev-dependencies]
png = "0.18.1"
